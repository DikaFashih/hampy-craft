<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <defs>
    <!-- Background Texture -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F5EE"/>
      <stop offset="100%" stop-color="#EBE6D8"/>
    </linearGradient>

    <!-- Card Fill -->
    <linearGradient id="boxFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4730"/>
      <stop offset="100%" stop-color="#102E1E"/>
    </linearGradient>
    <linearGradient id="boxSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#245A3D"/>
      <stop offset="100%" stop-color="#153B27"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF5"/>
      <stop offset="100%" stop-color="#EFE9DA"/>
    </linearGradient>

    <!-- Kraft Paper Gradient -->
    <linearGradient id="kraftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D5B8"/>
      <stop offset="50%" stop-color="#D9C39E"/>
      <stop offset="100%" stop-color="#BC9E6E"/>
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#10281B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="620" rx="12" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="968" height="588" rx="8" fill="none" stroke="#D5CBBA" stroke-width="2"/>

  <!-- Top Banner / Title Header -->
  <g transform="translate(48, 52)">
    <rect x="0" y="0" width="904" height="64" rx="6" fill="#153B27"/>
    <text x="24" y="38" fill="#FBF9F5" font-family="'Newsreader', Georgia, serif" font-size="22" font-weight="500">
      Hampy Lumina — Exclusive Knock-Down Export Packaging Architecture
    </text>
    <rect x="660" y="16" width="220" height="32" rx="16" fill="#245A3D" stroke="#D9C39E" stroke-width="1"/>
    <text x="770" y="37" fill="#F3DCAC" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">
      STANDAR KEMASAN EKSPOR
    </text>
  </g>

  <!-- Left: 3D Visualization of the Master Box & Cushioning System -->
  <g transform="translate(60, 160)" filter="url(#cardShadow)">
    <!-- Floor Shadow -->
    <ellipse cx="230" cy="380" rx="180" ry="24" fill="#10281B" opacity="0.15"/>

    <!-- 3D Export Carton Exterior (Green & White Identity) -->
    <!-- Top Flap -->
    <polygon points="120,80 250,30 370,80 240,130" fill="url(#boxTop)" stroke="#D5CBBA" stroke-width="2"/>
    <!-- Left Side -->
    <polygon points="120,80 240,130 240,350 120,290" fill="url(#boxFront)" stroke="#0E2418" stroke-width="2"/>
    <!-- Right Side -->
    <polygon points="240,130 370,80 370,290 240,350" fill="url(#boxSide)" stroke="#0E2418" stroke-width="2"/>

    <!-- Top White Accent Band on Left Face -->
    <polygon points="120,80 240,130 240,165 120,115" fill="#FAF7F0"/>
    <text x="175" y="132" fill="#10281B" font-family="'Newsreader', serif" font-size="14" font-weight="700">HAMPY CRAFT</text>
    <text x="175" y="146" fill="#355241" font-family="system-ui, sans-serif" font-size="9" font-weight="600">SLEMAN • YOGYAKARTA</text>

    <!-- Big Model Name on Left Face -->
    <text x="136" y="210" fill="#FAF7F0" font-family="'Newsreader', serif" font-size="20" font-weight="600">Hampy Lumina</text>
    <text x="136" y="230" fill="#B8CEBA" font-family="system-ui, sans-serif" font-size="10" letter-spacing="1">ARCHITECTURAL PENDANT</text>
    <text x="136" y="275" fill="#D9C39E" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Ø 35 cm × H 40 cm • 10 PCS</text>

    <!-- Export Markings (Right Face) -->
    <g transform="translate(260, 150)" stroke="#D9C39E" stroke-width="1.6" fill="none">
      <!-- Wineglass (Fragile) -->
      <path d="M12,8 Q12,24 24,24 Q36,24 36,8 Z M24,24 L24,36 M16,36 L32,36" stroke-linecap="round"/>
      <!-- Arrows (This Way Up) -->
      <path d="M52,36 L52,14 M44,22 L52,14 L60,22 M68,36 L68,14 M60,22 L68,14 L76,22"/>
      <!-- Umbrella (Keep Dry) -->
      <path d="M86,22 C86,10 106,10 106,22 Z M96,22 L96,32 C96,36 92,36 92,32"/>
    </g>
    <text x="305" y="210" fill="#E8D5B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">5-PLY CORRUGATED / 50×50×45</text>
    <text x="305" y="325" fill="#FAF7F0" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">MADE IN INDONESIA</text>
  </g>

  <!-- Right: Internal Knock-down Packaging Layers Diagram -->
  <g transform="translate(480, 140)">
    <!-- Background Card -->
    <rect x="0" y="0" width="470" height="425" rx="8" fill="#FFFDF8" stroke="#D5CBBA" stroke-width="1.5" filter="url(#cardShadow)"/>

    <text x="24" y="36" fill="#10281B" font-family="'Newsreader', Georgia, serif" font-size="19" font-weight="600">
      Anatomi Perlindungan Berlapis &amp; Knock-Down
    </text>
    <line x1="24" y1="48" x2="446" y2="48" stroke="#E6E0D2" stroke-width="1"/>

    <!-- Layer 1: Honeycomb & Corrugated Pad -->
    <g transform="translate(24, 65)">
      <rect x="0" y="0" width="70" height="60" rx="4" fill="#EAE5D8" stroke="#B8A88E" stroke-width="1.5"/>
      <ellipse cx="35" cy="30" rx="22" ry="14" fill="#D5CBBA"/>
      <text x="86" y="24" fill="#153B27" font-family="system-ui, sans-serif" font-size="14" font-weight="700">1. Honeycomb Paper Wrap &amp; Sekat Karton Ganda</text>
      <text x="86" y="44" fill="#4A554C" font-family="system-ui, sans-serif" font-size="12">Bantalan kertas sarang lebah peredam getaran dan sekat karton gelombang ganda bebas plastik.</text>
    </g>

    <!-- Layer 2: Cotton Dust Bag -->
    <g transform="translate(24, 145)">
      <rect x="0" y="0" width="70" height="65" rx="4" fill="url(#kraftGrad)" stroke="#A6895B" stroke-width="1.5"/>
      <ellipse cx="35" cy="18" rx="20" ry="6" fill="#BC9E6E"/>
      <path d="M15,18 L12,48 Q35,58 58,48 L55,18 Z" fill="#D9C39E" stroke="#8C6E3D" stroke-width="1"/>
      <text x="86" y="24" fill="#153B27" font-family="system-ui, sans-serif" font-size="14" font-weight="700">2. Cotton Dust Bag &amp; Pelindung Gesekan</text>
      <text x="86" y="44" fill="#4A554C" font-family="system-ui, sans-serif" font-size="12">Setiap kap dibungkus kain katun alami berlogo untuk menjaga kerapian serat anyaman bambu.</text>
    </g>

    <!-- Layer 3: Separated Electrical Sub-Box -->
    <g transform="translate(24, 230)">
      <polygon points="8,16 35,4 62,16 35,28" fill="#F7F4EB" stroke="#153B27" stroke-width="1.5"/>
      <polygon points="8,16 35,28 35,52 8,40" fill="#153B27"/>
      <polygon points="35,28 62,16 62,40 35,52" fill="#245A3D"/>
      <circle cx="35" cy="22" r="4" fill="#FFE79A"/>
      <text x="86" y="24" fill="#153B27" font-family="system-ui, sans-serif" font-size="14" font-weight="700">3. Kotak Terpisah (Komponen Listrik)</text>
      <text x="86" y="44" fill="#4A554C" font-family="system-ui, sans-serif" font-size="12">Kabel tekstil kain, dudukan fitting E27, dan bohlam LED dikemas terpisah di bagian atas karton.</text>
    </g>

    <!-- Layer 4: Structural Circular Bamboo Frame -->
    <g transform="translate(24, 315)">
      <circle cx="35" cy="30" r="26" fill="none" stroke="#C88A36" stroke-width="4"/>
      <circle cx="35" cy="30" r="21" fill="none" stroke="#8C6E3D" stroke-width="1.5" stroke-dasharray="2,2"/>
      <text x="86" y="24" fill="#153B27" font-family="system-ui, sans-serif" font-size="14" font-weight="700">4. Rangka Bambu Melingkar Pengunci Bawah</text>
      <text x="86" y="44" fill="#4A554C" font-family="system-ui, sans-serif" font-size="12">Cincin bambu kokoh menjaga geometri kubah tetap presisi saat penumpukan knock-down.</text>
    </g>

    <!-- Bottom summary pill -->
    <rect x="24" y="385" width="422" height="28" rx="4" fill="#EAE2CE"/>
    <text x="235" y="403" fill="#10281B" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">
      Efisiensi Kargo: 10 kap per karton (50×50×45 cm) • 0.1125 CBM • Berat Kotor 14,75 kg
    </text>
  </g>
</svg>
